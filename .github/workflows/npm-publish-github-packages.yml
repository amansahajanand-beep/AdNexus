name: Deploy AdNexus

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "SSH Connected: $(whoami)@$(hostname)"

            APP_DIR=/opt/adnexus/AdNexus

            echo "===== AdNexus Deployment Started ====="

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "===== Cloning Repository ====="
              mkdir -p /opt/adnexus
              rm -rf "$APP_DIR"
              git clone https://github.com/amansahajanand-beep/AdNexus.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "===== Updating to Latest Master ====="
            git fetch origin master
            git reset --hard origin/master
            git log -1 --oneline

            echo "===== Installing Frontend Dependencies ====="
            cd "$APP_DIR/frontend"
            npm install --no-audit --no-fund

            echo "===== Building Frontend ====="
            npm run build

            echo "===== Installing Backend Dependencies ====="
            cd "$APP_DIR/backend"
            npm install --no-audit --no-fund

            echo "===== Restarting Backend (web + worker) ====="
            pm2 restart adnexus adnexus-worker --update-env

            echo "===== Saving PM2 ====="
            pm2 save

            echo "===== Deployment Completed ====="
